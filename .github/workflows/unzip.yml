name: Extract FootballAI

on:
  push:
    paths:
      - "FootballAI_PWA_Android.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        run: |
          mkdir -p /tmp/footballai
          unzip -q FootballAI_PWA_Android.zip -d /tmp/footballai

          if [ -d "/tmp/footballai/FootballAI_FINAL" ]; then
            cp -a /tmp/footballai/FootballAI_FINAL/. .
          else
            cp -a /tmp/footballai/. .
          fi

          rm -f FootballAI_PWA_Android.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add FootballAI project"
          git push
